<html>
    <head>
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="homeheader">HOME</h3>
                <div class="homescore"><div id="home-point">0</div></div>
                <div class="homescore-btns"> <button onclick = "addoneh()">+1</button> <button onclick = "addtwoh()">+2</button> <button onclick = "addthreeh()">+3</button></div>
            </div>
            
            <div><button class="resetbtn" onclick="resetscores()">RESET</button></div>
            
            <div>
                <h3 class="guestheader">GUEST</h3>
                <div class="guestscore"><div id="guest-point">0</div></div>
                <div class="guestscore-btns"> 
                    <button onclick = "addoneg()">+1</button> <button onclick = "addtwog()">+2</button> <button onclick = "addthreeg()">+3</button></div>
            </div>
        </div>
        
            
            
        <script src="index.js"></script>
    </body>
</html>
